services:
  - type: web
    name: pharma-ci-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharma-intel-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.9.0 